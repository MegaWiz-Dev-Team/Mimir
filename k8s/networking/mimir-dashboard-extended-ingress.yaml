# Extra routes on mimir.asgard.internal, layered on top of asgard-ingress.
#
# asgard-ingress (ingress-routes.yaml) owns `/` -> mimir-dashboard for this host.
# The mimir-dashboard (Next.js) serves its OWN rich pages under that catch-all,
# including /graph (a sigma.js knowledge-graph view with search + the /api/assistant
# chat) and /graph/3d. Those pages fetch graph data straight from mimir-api
# (NEXT_PUBLIC_API_URL / MIMIR_API_URL), so they need no special ingress route.
#
# This object exists for ONE thing the catch-all can't serve: /api/v1 must reach
# mimir-api directly (SSO config at /api/v1/auth/sso-config, /api/v1/assistant/help,
# etc.). Longest-prefix match makes /api/v1 win over `/`.
#
# History / do-not-repeat: an earlier revision of THIS file also routed /graph and
# /api/graph to the standalone neo4j-graph-viewer (a bare D3 page). That was a
# mistake -- it shadowed the dashboard's own /graph and users lost search + chat.
# The viewer is a separate, simpler tool; reach it directly on its NodePort
# (:30888) if you want the raw D3 view. Do NOT put /graph here: /graph belongs to
# the dashboard. The `kubectl patch` that once reduced this Ingress to /api/v1 was
# intentional for exactly this reason, not accidental drift.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mimir-dashboard-extended
  namespace: asgard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mimir.asgard.internal
      secretName: mimir-tls
  rules:
    - host: mimir.asgard.internal
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: mimir-api
                port:
                  number: 8080
